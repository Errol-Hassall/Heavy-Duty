services:
  heavy-duty:
    build: .
    image: heavy-duty:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_PATH: /data/heavy-duty.db
    volumes:
      - heavy-duty-data:/data
    security_opt:
      - no-new-privileges:true

volumes:
  heavy-duty-data:
